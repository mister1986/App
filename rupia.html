<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rupia Cafe — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#1a0f0a;
    --ink-800:#251610;
    --panel:#2f1c12;
    --card:#33200f;
    --card-2:#3c2716;
    --hairline:#5a3c22;
    --hairline-soft:rgba(216,171,92,.18);
    --cream:#f6ecd9;
    --cream-dim:#d9c3a6;
    --muted:#a98862;
    --gold:#d8ab5c;
    --gold-deep:#b9822f;
    --gold-ink:#2a1608;
    --rust:#c1653a;
    --shadow: 0 20px 44px -22px rgba(0,0,0,.65);
    --r-card: 18px;
    --r-chip: 14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink-900);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }
  ::selection{background:var(--gold);color:var(--gold-ink);}

  .fa{
    font-family:'Vazirmatn', 'Work Sans', sans-serif;
    direction:rtl;
    unicode-bidi:isolate;
  }

  a{color:inherit;}

  /* ---------- HERO / HEADER ---------- */
  .hero{
    position:relative;
    padding:46px 20px 26px;
    background:
      radial-gradient(120% 90% at 18% -15%, rgba(216,171,92,.20), transparent 58%),
      linear-gradient(180deg, var(--ink-800), var(--ink-900));
    border-bottom:1px solid var(--hairline);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(216,171,92,.05) 0 1px, transparent 1px 60px);
    pointer-events:none;
  }
  .crumb{
    position:relative;
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--muted);
    margin-bottom:18px;
  }
  .crumb span{opacity:.5;}

  .hero-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
    position:relative;
  }
  .brand-mark{
    width:48px; height:48px; flex:0 0 auto;
    border:1px solid var(--gold-deep);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-size:21px; font-style:italic;
    color:var(--gold);
    background:rgba(216,171,92,.06);
  }
  .brand-fa{
    font-size:15px; color:var(--muted); margin-top:6px;
  }
  h1.brand-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(32px, 9.5vw, 44px);
    line-height:1;
    margin:14px 0 6px;
    color:var(--cream);
    letter-spacing:.2px;
  }
  .tagline{
    max-width:34ch;
    color:var(--cream-dim);
    font-size:14.5px;
    line-height:1.6;
    margin:0;
  }
  .tagline .fa{display:block; color:var(--muted); font-size:14px; margin-top:4px;}

  /* ---------- SEARCH ---------- */
  .search-wrap{
    padding:16px 20px 0;
    position:relative;
    z-index:2;
  }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:999px;
    padding:12px 16px;
  }
  .search-box svg{flex:0 0 auto; opacity:.65; color:var(--gold);}
  .search-box input{
    background:none; border:0; outline:0; width:100%;
    color:var(--cream); font-family:'Work Sans', sans-serif; font-size:15px;
  }
  .search-box input::placeholder{color:var(--muted);}
  .search-clear{
    background:none;border:0;color:var(--muted);font-size:18px;line-height:1;
    padding:2px 4px; cursor:pointer; display:none;
  }
  .search-box.has-text .search-clear{display:block;}

  /* ---------- CATEGORY NAV (icon tabs, à la Amir Chocolate) ---------- */
  .catnav-sticky{
    position:sticky; top:0; z-index:20;
    background:rgba(26,15,10,.94);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .catnav{
    display:flex; gap:10px;
    overflow-x:auto;
    padding:14px 16px;
    scrollbar-width:none;
  }
  .catnav::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:8px 14px 9px;
    border-radius:var(--r-chip);
    border:1px solid transparent;
    background:transparent;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    transition:background .18s ease, border-color .18s ease;
    min-width:66px;
  }
  .chip-icon{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card);
    border:1px solid var(--hairline);
    color:var(--gold);
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .chip-icon svg{width:20px; height:20px;}
  .chip-label{
    font-size:11.5px;
    color:var(--cream-dim);
    white-space:nowrap;
    font-weight:500;
  }
  .chip.active .chip-icon{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--gold-ink);
  }
  .chip.active .chip-label{color:var(--gold); font-weight:600;}
  .chip:hover .chip-icon{border-color:var(--gold-deep);}

  /* ---------- MAIN / SECTIONS ---------- */
  main{padding:10px 0 20px;}

  .section{
    padding:36px 20px 8px;
    scroll-margin-top:96px;
    border-bottom:1px solid var(--hairline);
  }
  .section:last-child{border-bottom:0;}

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:20px;
    gap:12px;
    padding-bottom:12px;
    border-bottom:1px solid var(--hairline-soft);
  }
  .section-head h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:24px;
    margin:0;
    color:var(--gold);
  }
  .section-head .fa{
    color:var(--muted);
    font-size:14.5px;
  }

  /* ---------- PRODUCT GRID CARDS ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--hairline);
    border-radius:var(--r-card);
    padding:16px 14px 14px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:10px;
  }
  .card-icon{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--card-2);
    border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    flex:0 0 auto;
  }
  .card-icon svg{width:19px; height:19px;}

  /* photo variant: full-width square image at top of card, price badge overlaid */
  .card.has-photo{padding:0; overflow:hidden;}
  .card.has-photo .card-photo{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--card-2);
    overflow:hidden;
    border-bottom:1px solid var(--hairline);
  }
  .card.has-photo .card-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .card.has-photo .card-photo .card-price{
    position:absolute; top:8px; inset-inline-end:8px;
    background:rgba(26,15,10,.78);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
  }
  .card.has-photo .card-body{padding:14px 14px 15px;}
  .card-price{
    background:rgba(216,171,92,.12);
    border:1px solid var(--hairline-soft);
    color:var(--gold);
    font-size:13.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .card-name{
    font-size:15.5px; font-weight:600; color:var(--cream);
    margin:0 0 3px;
    line-height:1.3;
  }
  .card-name-fa{
    font-size:13.5px;
    color:var(--cream-dim);
    margin-bottom:6px;
  }
  .card-desc{
    font-size:12px;
    line-height:1.55;
    color:var(--muted);
    margin-top:2px;
  }

  .variants{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--hairline);
    display:flex; flex-direction:column; gap:6px;
  }
  .variant-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .variant-label{font-size:12.5px; color:var(--cream-dim);}
  .variant-label .fa{color:var(--muted); font-size:12px;}
  .variant-price{font-size:12.5px; color:var(--gold); font-weight:600; white-space:nowrap;}

  mark{
    background:var(--gold);
    color:var(--gold-ink);
    border-radius:3px;
    padding:0 2px;
  }

  .no-results{
    display:none;
    padding:60px 22px;
    text-align:center;
    color:var(--muted);
  }
  .no-results h3{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    color:var(--cream); font-size:20px; margin:0 0 8px;
  }
  body.searching .section{display:none;}
  body.searching .section.match{display:block;}
  body.searching .card{display:none;}
  body.searching .card.match{display:flex;}
  body.no-match .no-results{display:block;}

  /* ---------- FOOTER ---------- */
  footer{
    padding:34px 22px 10px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }
  footer .fa{display:block; color:var(--gold-deep); margin-top:4px; font-size:13px;}

  /* ---------- BACK TO TOP ---------- */
  .top-btn{
    position:fixed;
    right:16px; bottom:16px;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--gold);
    color:var(--gold-ink);
    border:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
    opacity:0; pointer-events:none;
    transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
    z-index:30;
  }
  .top-btn.show{opacity:1; pointer-events:auto; transform:translateY(0);}

  @media (min-width:520px){
    .grid{grid-template-columns:repeat(3, 1fr);}
  }

  @media (min-width:720px){
    .hero{padding:60px 40px 32px;}
    .search-wrap{padding:18px 40px 0;}
    .catnav{padding:14px 40px;}
    .section{padding:44px 40px 8px;}
    main{max-width:880px; margin:0 auto;}
    .hero, .search-wrap, .catnav-sticky > .catnav, footer{max-width:880px; margin:0 auto;}
    .grid{grid-template-columns:repeat(4, 1fr);}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="hero">
  <nav class="crumb">خانه <span>/</span> منو <span>/</span> عظیمیه</nav>
  <div class="hero-top">
    <div>
      <span class="brand-fa fa">کافه روپیا</span>
      <h1 class="brand-name">Rupia Cafe</h1>
      <p class="tagline">Breakfast, coffee and hand-made cake, all day.
        <span class="fa">صبحانه، قهوه و کیک خانگی، تمام روز</span>
      </p>
    </div>
    <div class="brand-mark" aria-hidden="true">R</div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box" id="searchBox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" inputmode="search" placeholder="Search the menu…" autocomplete="off">
    <button class="search-clear" id="searchClear" aria-label="Clear search">×</button>
  </div>
</div>

<nav class="catnav-sticky">
  <div class="catnav" id="catnav"></div>
</nav>

<main id="main"></main>

<div class="no-results" id="noResults">
  <h3>Nothing on the menu matches</h3>
  <p>Try a different word, or clear the search.</p>
</div>

<footer>
  Prices as listed on the printed menu.
  <span class="fa">قیمت‌ها طبق منوی چاپی کافه است</span>
</footer>

<button class="top-btn" id="topBtn" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script>

  glace: '<path d="M7 10h10l-1.5 8a2 2 0 0 1-2 1.6h-3a2 2 0 0 1-2-1.6z"/><path d="M5 10a7 7 0 0 1 14 0z"/><path d="M12 3v3"/>',
  milkshake: '<path d="M8 4h8l-1 4H9z"/><path d="M7.5 8h9L15 20.3a2 2 0 0 1-2 1.7h-2a2 2 0 0 1-2-1.7z"/><path d="M16 6l3-1.5"/>',
  cake: '<path d="M4 20 12 5l8 15z"/><path d="M8 20l4-7 4 7"/><circle cx="12" cy="4" r="1"/>',

};
function iconSvg(id){
  const p = ICONS[id] || ICONS.hotcoffee;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* product photos matched by name from amirchocolate.com's live menu (hotlinked — served from their CDN).
   Keyed by "categoryId|item name" since a few names (Espresso, Dark Chocolate…) repeat across categories. */
const PHOTOS = {

const nav = document.getElementById('catnav');

function fmt(n){ return n.toLocaleString('en-US'); }
function placeholderImage(product, category){
  const esc = String(product).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const cat = String(category).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3c2716"/><stop offset="1" stop-color="#1a0f0a"/>
      </linearGradient>
    </defs>
    <rect width="800" height="800" fill="url(#g)"/>
    <circle cx="400" cy="300" r="150" fill="none" stroke="#d8ab5c" stroke-width="10" opacity=".85"/>
    <path d="M290 290h220v115c0 58-47 105-105 105h-10c-58 0-105-47-105-105z" fill="none" stroke="#d8ab5c" stroke-width="10"/>
    <path d="M510 320h38c45 0 70 32 70 65s-25 65-70 65h-38" fill="none" stroke="#d8ab5c" stroke-width="10"/>
    <path d="M340 190c-20-35 25-48 0-82M400 190c-20-35 25-48 0-82M460 190c-20-35 25-48 0-82" fill="none" stroke="#d8ab5c" stroke-width="8" stroke-linecap="round"/>
    <text x="400" y="610" text-anchor="middle" fill="#f6ecd9" font-family="Arial,sans-serif" font-size="34" font-weight="700">${esc}</text>
    <text x="400" y="655" text-anchor="middle" fill="#a98862" font-family="Arial,sans-serif" font-size="24">${cat}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}


MENU.forEach(cat=>{
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.dataset.target = cat.id;
  chip.innerHTML = `<span class="chip-icon">${iconSvg(cat.id)}</span><span class="chip-label">${cat.name}</span>`;
  chip.addEventListener('click', ()=>{
    document.getElementById(cat.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  nav.appendChild(chip);

  const section = document.createElement('section');
  section.className = 'section';
  section.id = cat.id;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `<h2>${cat.name}</h2><span class="fa">${cat.fa}</span>`;
  section.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  cat.items.forEach(it=>{
    const card = document.createElement('article');
    const photo = PHOTOS[cat.id + '|' + it.name] || CATEGORY_FALLBACKS[cat.id];
    card.className = 'card has-photo';
    card.dataset.search = (it.name + ' ' + it.fa + ' ' + (it.desc||'') + ' ' + (it.variants ? it.variants.map(v=>v.label+' '+v.fa).join(' ') : '')).toLowerCase();

    const priceHtml = it.price !== undefined ? `<span class="card-price">${fmt(it.price)}</span>` : '';

    let html = '';
    if(photo){
      html += `<div class="card-photo"><img src="${photo}" alt="${it.name} — ${cat.name}" loading="lazy" onerror="this.onerror=null; this.src=placeholderImage(this.alt, '${cat.name}');">${priceHtml}</div>`;
      html += `<div class="card-body">`;
      html += `<h3 class="card-name">${it.name}</h3>`;
      html += `<div class="card-name-fa fa">${it.fa}</div>`;
      if(it.desc) html += `<p class="card-desc">${it.desc}</p>`;
      if(it.variants){
        html += `<div class="variants">`;
        it.variants.forEach(v=>{
          html += `<div class="variant-row"><span class="variant-label">${v.label} <span class="fa">${v.fa}</span></span><span class="variant-price">${fmt(v.price)}</span></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="card-top"><span class="card-icon">${iconSvg(cat.id)}</span>${priceHtml}</div>`;
      html += `<h3 class="card-name">${it.name}</h3>`;
      html += `<div class="card-name-fa fa">${it.fa}</div>`;
      if(it.desc) html += `<p class="card-desc">${it.desc}</p>`;
      if(it.variants){
        html += `<div class="variants">`;
        it.variants.forEach(v=>{
          html += `<div class="variant-row"><span class="variant-label">${v.label} <span class="fa">${v.fa}</span></span><span class="variant-price">${fmt(v.price)}</span></div>`;
        });
        html += `</div>`;
      }
    }
    card.innerHTML = html;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  mainEl.appendChild(section);
});

/* active chip on scroll */
if(nav.firstChild) nav.firstChild.classList.add('active');
const chips = [...nav.querySelectorAll('.chip')];
const sections = [...document.querySelectorAll('.section')];
const io = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const chip = chips.find(c=>c.dataset.target===entry.target.id);
      if(chip){
        chips.forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        chip.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      }
    }
  });
}, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
sections.forEach(s=>io.observe(s));

/* search */
const searchInput = document.getElementById('searchInput');
const searchBox = document.getElementById('searchBox');
const searchClear = document.getElementById('searchClear');
const allCards = [...document.querySelectorAll('.card')];

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  searchBox.classList.toggle('has-text', q.length>0);

  if(!q){
    document.body.classList.remove('searching','no-match');
    allCards.forEach(c=>c.classList.remove('match'));
    return;
  }

  document.body.classList.add('searching');
  let anyMatch = false;
  sections.forEach(sec=>{
    let sectionHasMatch = false;
    sec.querySelectorAll('.card').forEach(card=>{
      const hit = card.dataset.search.includes(q);
      card.classList.toggle('match', hit);
      if(hit){ sectionHasMatch = true; anyMatch = true; }
    });
    sec.classList.toggle('match', sectionHasMatch);
  });
  document.body.classList.toggle('no-match', !anyMatch);
}
searchInput.addEventListener('input', runSearch);
searchClear.addEventListener('click', ()=>{
  searchInput.value='';
  runSearch();
  searchInput.focus();
});

/* back to top */
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', ()=>{
  topBtn.classList.toggle('show', window.scrollY > 600);
}, { passive:true });
topBtn.addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
